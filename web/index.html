<!DOCTYPE html>
<!-- 🎞️ class="hexa-motion" keeps the enter/leave animation even when the OS asks to reduce motion -->
<html lang="th" class="hexa-motion">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hexa_progbar</title>
    <!-- 🧹 Bump every ?v= here together with ui_page in fxmanifest.lua - CEF caches this page too -->
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <div id="rbp-layer" class="rbp-layer">
        <!-- 📌 Screen-fixed bottom-center bar, placed by CSS alone -->
        <div id="rbp-dock" class="rbp-dock"></div>

        <!-- 🗣️ Screen reader line, must exist from the first frame and never be replaced -->
        <div id="rbp-live" class="hx-sr" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
    <script src="hexa-icons.js"></script>
    <script src="app.js?v=4"></script>
</body>
</html>
